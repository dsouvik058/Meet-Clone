user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Map for WebSocket Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Services (Docker network DNS names)
    upstream identity_backend {
        server identity-service:8081;
    }

    upstream meeting_backend {
        server meeting-service:8082;
    }

    upstream signaling_backend {
        server signaling-service:8083;
    }

    upstream recording_backend {
        server recording-service:8084;
    }

    upstream notification_backend {
        server notification-service:8085;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -------------------------------------------------------------
        # Security: Deny public access to internal inter-service routes
        # -------------------------------------------------------------
        location /internal/ {
            return 403;
        }

        # -------------------------------------------------------------
        # 1. Identity Service (Authentication & User Profiles)
        # -------------------------------------------------------------
        location /auth/ {
            proxy_pass http://identity_backend/auth/;
        }

        location /users/ {
            proxy_pass http://identity_backend/users/;
        }

        # -------------------------------------------------------------
        # 2. Meeting Service (Rooms, Participants, Chat)
        # -------------------------------------------------------------
        location /meetings/ {
            proxy_pass http://meeting_backend/meetings/;
        }

        # -------------------------------------------------------------
        # 3. Signaling Service (WebRTC Signaling over WebSockets)
        # -------------------------------------------------------------
        location /ws/ {
            proxy_pass http://signaling_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Extended timeouts for long-running video conferences
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # -------------------------------------------------------------
        # 4. Recording Service (Kurento Recording & S3 Playback)
        # -------------------------------------------------------------
        location /recordings/ {
            proxy_pass http://recording_backend/recordings/;
        }

        # -------------------------------------------------------------
        # 5. Notification Service (Waiting Room, Presence, Alerts)
        # -------------------------------------------------------------
        location /notifications/ {
            proxy_pass http://notification_backend/notifications/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -------------------------------------------------------------
        # Health Checks
        # -------------------------------------------------------------
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"nginx","services":["identity","meeting","signaling","recording","notification"]}';
        }

        location /health/identity {
            proxy_pass http://identity_backend/health;
        }

        location /health/meeting {
            proxy_pass http://meeting_backend/health;
        }

        location /health/signaling {
            proxy_pass http://signaling_backend/health;
        }

        location /health/recording {
            proxy_pass http://recording_backend/health;
        }

        location /health/notification {
            proxy_pass http://notification_backend/health;
        }
    }
}
