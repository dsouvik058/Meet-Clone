services:
  # -------------------------------------------------------------
  # PostgreSQL (4 independent databases via init script)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: meet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meet-network

  # -------------------------------------------------------------
  # Redis (Presence tracking, WebSocket signaling state)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: meet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meet-network

  # -------------------------------------------------------------
  # Apache Kafka (KRaft mode - No Zookeeper required)
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: meet-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-cluster cluster-id --bootstrap-server localhost:9092 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meet-network

  # -------------------------------------------------------------
  # Kurento Media Server (WebRTC Media Plane)
  # -------------------------------------------------------------
  kurento:
    image: kurento/kurento-media-server:6.18.0
    container_name: meet-kurento
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "5000-5050:5000-5050/udp"
    networks:
      - meet-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  meet-network:
    name: meet-network
    driver: bridge
