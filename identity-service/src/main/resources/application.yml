server:
  port: 8081

spring:
  application:
    name: identity-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${IDENTITY_DB_URL:${DB_URL}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.meetclone.identity: INFO
    org.apache.tomcat.util.http.parser.Cookie: OFF
    org.hibernate: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  oauth2:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    discord:
      client-id: ${DISCORD_CLIENT_ID}
      client-secret: ${DISCORD_CLIENT_SECRET}
      redirect-uri: ${DISCORD_REDIRECT_URI}

