server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:${DB_URL}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.meetclone.identity: INFO
    org.apache.tomcat.util.http.parser.Cookie: OFF
    org.hibernate: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:${JWT_SECRET:change-me-to-a-long-random-string-must-be-at-least-256-bits-long}}
    refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET:change-me-to-another-long-random-refresh-secret-at-least-256-bits}}
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-must-be-at-least-256-bits-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  oauth2:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}

